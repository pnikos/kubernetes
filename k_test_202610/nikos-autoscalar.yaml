apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-server
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web-server}
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: AverageValue
        averageValue: 4m

