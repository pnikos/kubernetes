apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  labels:
    app: web-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
      - image: pyserver:1.1
        name: nikos-pyserver
        imagePullPolicy: Never
        ports: [{containerPort: 8080}]
        resources: 
           requests: {cpu: 5m, memory: 32Mi}
           limits: {cpu: 100m, memory: 128Mi}
status: {}

